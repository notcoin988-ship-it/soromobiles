# E2E-сценарий §14: регистрация → подтверждение → первый вопрос → ответ.
#
# Maestro, а не Detox: Detox требует отдельной инструментированной сборки и
# своего раннера, Maestro работает с обычным APK и читает экран так же, как
# программа чтения с экрана. Для пяти сценариев из §14 это дешевле на порядок.
#
# ПЕРЕД ЗАПУСКОМ:
#   1. EXPO_PUBLIC_API_URL указывает на развёрнутый бэкенд (файл .env)
#   2. npx expo start --dev-client
#   3. maestro test .maestro/01-signup-to-answer.yaml
#
# Код подтверждения приходит письмом. Ввести его автоматически нельзя: он
# случайный, поэтому шаг помечен как ручной и сценарий останавливается на нём.
# Полностью автоматическим он станет с тестовым почтовым ящиком, из которого
# можно читать письма.
appId: ai.zypl.soro
---
- launchApp:
    clearState: true

# Экран входа
- assertVisible: 'Хуш омадед ба Soro'
- assertVisible: 'Почтаи электронӣ'

# §8.2: ни Google, ни гостевого входа быть не должно
- assertNotVisible: 'Google'
- assertNotVisible: 'меҳмон'

# Переход к регистрации
- tapOn: 'Аккаунт надоред?'
- assertVisible: 'Сабти ном'

- tapOn:
    id: 'signup-fullname'
- inputText: 'Maestro Test'
- tapOn:
    id: 'signup-email'
- inputText: 'maestro@zehn.ai'
- tapOn:
    id: 'signup-password'
- inputText: 'Parol12345'

# §8.2: без согласия с документами форма не уходит — кнопка ответит ошибкой,
# а не переходом. Шаг обязателен, и это не формальность: он же проверяет, что
# галочка вообще осталась на экране.
- tapOn:
    id: 'signup-consent'

- tapOn:
    id: 'signup-submit'

# Экран подтверждения почты
- assertVisible: 'Почтаро тасдиқ кунед'
- assertVisible:
    text: 'Такрор фиристодан пас аз.*'

# Дальше нужен код из лога мок-сервера — см. комментарий в шапке файла.
