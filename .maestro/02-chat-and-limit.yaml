# E2E §14: вопрос → потоковый ответ → действия над ответом → удаление чата.
#
# Сценарий стартует с уже выполненного входа: clearState здесь НЕТ намеренно,
# иначе каждый прогон упирался бы в код подтверждения из письма.
#
# Запуск (EXPO_PUBLIC_API_URL указывает на развёрнутый бэкенд):
#   maestro test .maestro/02-chat-and-limit.yaml
appId: ai.zypl.soro
---
- launchApp

# Пустое состояние (§7.5): логотип, приветствие, подсказки
- assertVisible:
    text: 'Салом.*'
- assertVisible: 'Имрӯз чӣ гуна метавонам кӯмак кунам?'

# Вопрос
- tapOn:
    id: 'chat-input'
- inputText: 'Пойтахти Тоҷикистон кадом шаҳр аст?'
- tapOn:
    id: 'chat-send'

# Пока идёт генерация — индикатор «Фикр дорам…» (§7.5)
- assertVisible: 'Фикр дорам…'

# Ответ пришёл: под ним появился ряд действий (§8.3).
# 60 секунд, а не 10: живая модель на 27B отвечает не мгновенно.
- extendedWaitUntil:
    visible:
        id: 'message-longpress-.*'
    timeout: 60000

# Drawer: список диалогов (§8.4)
- tapOn:
    id: 'chat-menu'
- assertVisible: 'Чати нав'
- assertVisible: 'Ҷустуҷӯ'

# Поиск по локальной базе — чат должен найтись по тексту вопроса
- tapOn:
    id: 'drawer-search'
- inputText: 'Пойтахт'
- assertVisible:
    text: 'Пойтахт.*'
